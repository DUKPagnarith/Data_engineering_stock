# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Stock Prediction Pipeline — Full Infrastructure Stack
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Usage:
#   docker-compose up -d          # start all services
#   docker-compose logs -f kafka  # tail Kafka broker logs
#   docker-compose down           # stop (data preserved in named volumes)
#   docker-compose down -v        # stop & remove ALL volumes (full reset)
#
# Services:
#   zookeeper            — coordination service for Kafka          :2181
#   kafka                — single-node broker                      :9092
#   schema-registry      — Confluent Schema Registry               :8081
#   kafka-init           — one-shot topic creation
#   stock_postgres       — PostgreSQL database                     :5432  ← NEW
#   stock_pgadmin        — pgAdmin web GUI                         :5050  ← NEW
#   stock_metabase       — Metabase BI dashboards                  :3000  ← NEW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "3.8"

# ── Shared Airflow config (anchor reused by all 3 Airflow services) ─────────
x-airflow-common: &airflow-common
  build:
    context: .                          # project root, so Dockerfile can COPY requirements.txt
    dockerfile: docker/airflow/Dockerfile
  image: stock-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Airflow's OWN metadata DB lives in the `airflow` database on the shared
    # Postgres. Uses the literal container name (Airflow doesn't go through
    # config/settings.py, so no host-swap concern here).
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-stock_user}:${POSTGRES_PASSWORD:-stock_password}@stock_postgres:5432/airflow
    # Fixed keys so restarts don't invalidate sessions / encrypted values.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-Zp8kP3qLrV6sN1tW9xY2bC4dE7fG0hJ5kM8nQ1rS3u=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-stock-airflow-demo-secret}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Passed through to DAG tasks (see dags/daily_training_dag.py TASK_ENV).
    DEFAULT_TICKER: ${DEFAULT_TICKER:-AAPL}
    POSTGRES_HOST: stockdb
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-stock_db}
    POSTGRES_USER: ${POSTGRES_USER:-stock_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_password}
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
  volumes:
    - .:/opt/project                    # project source — DAG tasks `cd` here;
                                        # artifacts (data/, mlruns) written back to host
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  user: "0:0"                           # root: reliable bind-mount writes for the demo
  networks:
    - stock-net

services:
  # ────────────────────────────────────────────────────────────────────────
  #  KAFKA INFRASTRUCTURE (unchanged)
  # ────────────────────────────────────────────────────────────────────────

  # ── Zookeeper ───────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-net

  # ── Kafka Broker ────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # external access (from host machine)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for internal Docker traffic, one for host access
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Log retention (7 days default, configurable)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB per partition
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - stock-net

  # ── Schema Registry ────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - stock-net

  # ── Topic Initialisation (one-shot) ────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo '━━━ Creating Kafka topics ━━━' &&
      kafka-topics --create --bootstrap-server kafka:29092 --topic stock-prices-raw --partitions 3 --replication-factor 1 --if-not-exists --config retention.ms=604800000 &&
      kafka-topics --create --bootstrap-server kafka:29092 --topic stock-prices-dlq --partitions 1 --replication-factor 1 --if-not-exists --config retention.ms=2592000000 &&
      echo '━━━ Topics created successfully ━━━' &&
      kafka-topics --list --bootstrap-server kafka:29092
    restart: "no"
    networks:
      - stock-net

  # ────────────────────────────────────────────────────────────────────────
  #  DATABASE + BI SERVICES (new)
  # ────────────────────────────────────────────────────────────────────────

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  stock_postgres:
    image: postgres:15
    container_name: stock_postgres
    ports:
      - "5433:5432"    # host:5433 → container:5432 (avoids conflict with local Postgres)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_db}
      POSTGRES_USER: ${POSTGRES_USER:-stock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_user} -d ${POSTGRES_DB:-stock_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      stock-net:
        # `stockdb` alias: Airflow tasks set POSTGRES_HOST=stockdb so the
        # host→localhost swap in config/settings.get_postgres_url() is bypassed
        # while still resolving to this container on the Docker network.
        aliases:
          - stockdb

  # ── pgAdmin ────────────────────────────────────────────────────────────
  stock_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stock_pgadmin
    ports:
      - "5051:80"     # host:5051 → container:80 (avoids port conflict)
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@stock.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      stock_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock-net

  # ── Metabase ───────────────────────────────────────────────────────────
  stock_metabase:
    image: metabase/metabase:latest
    container_name: stock_metabase
    ports:
      - "3000:3000"
    environment:
      # Point Metabase's internal database at Postgres (separate "metabase" DB)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-stock_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-stock_password}
      MB_DB_HOST: stock_postgres
    depends_on:
      stock_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stock-net

  # ────────────────────────────────────────────────────────────────────────
  #  AIRFLOW — daily batch training orchestration
  # ────────────────────────────────────────────────────────────────────────

  # ── Airflow init (one-shot: create DB, migrate schema, make admin user) ──
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["bash", "/opt/project/docker/airflow/init.sh"]
    depends_on:
      stock_postgres:
        condition: service_healthy
    restart: "no"

  # ── Airflow Webserver (UI) ──────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8088:8080"     # UI at http://localhost:8088  (8080 left free for Spark UI)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow Scheduler (runs the DAGs) ───────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres_data:       # PostgreSQL data persists across docker-compose down
  pgadmin_data:        # pgAdmin saved state persists across restarts
  airflow-logs:        # Airflow task/scheduler logs

# ── Shared network ─────────────────────────────────────────────────────────
networks:
  stock-net:
    driver: bridge
